server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: almuerzoservice
  datasource:
    # MySQL local por defecto. En Render usar DB_URL / DB_USER / DB_PASSWORD
    # (también funciona con PostgreSQL cambiando DB_DRIVER y DB_DIALECT).
    url: ${DB_URL:jdbc:mysql://localhost:3306/almuerzoya?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
    open-in-view: false

security:
  jwt:
    # En producción definir JWT_SECRET como variable de entorno (mínimo 32 caracteres).
    secret: ${JWT_SECRET:dev-secret-cambiar-en-produccion-almuerzoya-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info
